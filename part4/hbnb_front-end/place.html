<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header>
        <img src="assets/images/logo.png" alt="Application logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="login-button">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="place-details" id="place-details">
            <!-- Contenu dynamique : nom, host, description, prix -->
        </section>

        <section id="reviews">
            <h2>Reviews</h2>
            <div id="reviews-list">
                <!-- Reviews dynamiques -->
            </div>
        </section>

        <section id="add-review" style="display:none;">
            <h2>Add a Review</h2>
            <form id="review-form">
                <textarea id="review-text" placeholder="Write your review..." required></textarea>

                <label for="rating">Rating:</label>
                <select id="rating" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <button type="submit">Submit Review</button>
            </form>
        </section>


    </main>

    <footer>
        <p>© 2025 All rights reserved.</p>
    </footer>

    <script src="assets/js/scripts.js"></script>
</body>
</html>
